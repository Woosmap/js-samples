<!DOCTYPE html>
<html>
  <head>
    <title>Map External Layer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />

    <!-- jsFiddle will insert css and js -->
  </head>
  <body>
    <div id="app">
      <div id="selector">
        <h3 class="panel-title">Map options</h3>

        <label class="select-container">
          <span class="label">Map style</span>
          <select id="woosmap-style-select">
            <option value="default">Default</option>
            <option value="lightgrey" selected>Light Grey</option>
            <option value="night">Transit By Night</option>
            <option value="retro">Retro</option>
          </select>
        </label>

        <label class="select-container">
          <span class="label">Overlay layer</span>
          <select id="layer-provider-select">
            <option value="pistes">OpenSnowMap ski runs</option>
            <option value="temperature">OpenWeather temperature</option>
            <option value="precipitation">OpenWeather precipitation</option>
          </select>
        </label>

        <label class="select-container">
          <span class="label">Opacity</span>
          <div class="opacity-control">
            <input
              id="opacity-value-input"
              type="range"
              value="1"
              step="0.05"
              min="0"
              max="1"
            />
            <span id="opacity-value-display">100%</span>
          </div>
        </label>
      </div>
      <wmp-map id="map"></wmp-map>
    </div>

    <script>
      ((g) => {
        let p;
        const w = window,
          d = document;
        const L = "importLibrary",
          CB = "__ib__";
        const E = "The Woosmap Maps JavaScript API";
        const woosmap = w.woosmap || (w.woosmap = {});
        const maps = woosmap.map || (woosmap.map = {});
        // Seed with the sample's configured libraries: some (e.g. widgets) are
        // not importLibrary() names and only load through the script URL.
        const libs = new Set(
            String(g.libraries || "")
              .split(",")
              .filter(Boolean),
          ),
          params = new URLSearchParams();
        const load = () =>
          p ||
          (p = new Promise((res, rej) => {
            const s = d.createElement("script");
            params.set("libraries", [...libs].join(","));
            for (const k in g)
              if (k !== "libraries" && g[k]) params.set(k, g[k]);
            params.set("callback", "woosmap.map." + CB);
            s.src = "https://sdk.woosmap.com/map/map.js?" + params;
            maps[CB] = res;
            s.onerror = () => rej(Error(E + " could not load."));
            s.nonce = d.querySelector("script[nonce]")?.nonce || "";
            d.head.append(s);
          }));
        if (maps[L]) {
          console.warn(E + " only loads once. Ignoring:", g);
        } else {
          maps[L] = (name, ...args) =>
            libs.add(name) && load().then(() => maps[L](name, ...args));
        }
      })({
        key: "woos-e1e5490b-19d1-34f8-9955-fd5cfc8c880f",
        libraries: "",
        language: "",
      });
    </script>
  </body>
</html>
