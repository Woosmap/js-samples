    <style>
      #map {
        display: block;
        width: 100%;
        height: 100%;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          Roboto,
          Helvetica Neue,
          Arial,
          Noto Sans,
          sans-serif,
          Apple Color Emoji,
          Segoe UI Emoji,
          Segoe UI Symbol,
          Noto Color Emoji;
      }
      .toggle {
        cursor: pointer;
        display: inline-block;
      }
      .toggle:hover .toggle-switch:before {
        background: linear-gradient(to bottom, #fff 0% 100%);
        box-shadow: 0 0 0 1px #00000080;
      }
      .toggle-switch {
        display: inline-block;
        background: #ccc;
        border-radius: 16px;
        width: 58px;
        height: 32px;
        position: relative;
        vertical-align: middle;
        transition: background 0.25s;
      }
      .toggle-switch:before {
        content: "";
        display: block;
        background: linear-gradient(to bottom, #fff, #eee);
        border-radius: 50%;
        box-shadow: 0 0 0 1px #00000040;
        width: 24px;
        height: 24px;
        position: absolute;
        top: 4px;
        left: 4px;
        transition: left 0.25s;
      }
      .toggle-switch:after {
        content: "";
      }
      .toggle-checkbox:checked + .toggle-switch {
        background: #56c080;
      }

        left: 30px;
      }
      .toggle-checkbox {
        position: absolute;
        visibility: hidden;
      }
      .toggle-label {
        margin-left: 5px;
        position: relative;
        top: 2px;
      }
      #map-panel {
        position: absolute;
        top: 0;
        left: 0;
        background-color: #fff;
        border-radius: 3px;
        box-shadow: 0 0 0 2px #0000001a;
        margin: 10px;
        padding: 5px;
        overflow: hidden;
        z-index: 1;
      }
    </style>
  </head>

        <input class="toggle-checkbox" type="checkbox" id="toggleQuery" />

    </div>
    <wmp-map id="map"></wmp-map>

        key: "woos-e1e5490b-19d1-34f8-9955-fd5cfc8c880f",
        libraries: "",
        language: "",
      });
    </script>
  </body>
</html>
