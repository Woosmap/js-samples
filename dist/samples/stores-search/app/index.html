<!DOCTYPE html>
<html>
  <head>
    <title>Stores Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />

    <link rel="stylesheet" type="text/css" href="./style.css" />
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <div id="container">
      <div class="search-panel" id="sidebar">
        <div id="search-container">
          <h3>Search Stores Nearby</h3>
          <div id="search-input-container">
            <input
              type="text"
              name="autocomplete"
              id="autocomplete-input"
              placeholder="Search an Address..."
              autocomplete="off"
            />
            <button class="btn" type="submit" id="submit-button">
              <span class="btnText" tabindex="-1">Search</span>
            </button>
          </div>
        </div>
        <div id="stores-panel">
          <div class="stores-list">
            <p style="padding: 0 0.8rem; font-size: 17px">
              Enter an address to geocode and search stores nearby or click on
              the map to reverse geocode and search around this location.
            </p>
          </div>
        </div>
      </div>
      <wmp-map id="map"></wmp-map>
    </div>

    <script>
      ((g) => {
        let p;
        const w = window,
          d = document;
        const L = "importLibrary",
          CB = "__ib__";
        const E = "The Woosmap Maps JavaScript API";
        const woosmap = w.woosmap || (w.woosmap = {});
        const maps = woosmap.map || (woosmap.map = {});
        // Seed with the sample's configured libraries: some (e.g. widgets) are
        // not importLibrary() names and only load through the script URL.
        const libs = new Set(
            String(g.libraries || "")
              .split(",")
              .filter(Boolean),
          ),
          params = new URLSearchParams();
        const load = () =>
          p ||
          (p = new Promise((res, rej) => {
            const s = d.createElement("script");
            params.set("libraries", [...libs].join(","));
            for (const k in g)
              if (k !== "libraries" && g[k]) params.set(k, g[k]);
            params.set("callback", "woosmap.map." + CB);
            s.src = "https://sdk.woosmap.com/map/map.js?" + params;
            maps[CB] = res;
            s.onerror = () => rej(Error(E + " could not load."));
            s.nonce = d.querySelector("script[nonce]")?.nonce || "";
            d.head.append(s);
          }));
        if (maps[L]) {
          console.warn(E + " only loads once. Ignoring:", g);
        } else {
          maps[L] = (name, ...args) =>
            libs.add(name) && load().then(() => maps[L](name, ...args));
        }
      })({
        key: "woos-e1e5490b-19d1-34f8-9955-fd5cfc8c880f",
        libraries: "marker",
        language: "",
      });
    </script>
  </body>
</html>
