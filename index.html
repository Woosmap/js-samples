<!DOCTYPE html>
<html>
  <head>
    <title>Distance Isochrone</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />

    <link rel="stylesheet" type="text/css" href="./style.css" />
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <div id="app">
      <div id="selector">
        <div class="select-container">
          <span>mode </span>
          <select id="isochrone-mode-select">
            <option value="driving">Driving</option>
            <option value="walking">Walking</option>
            <option value="cycling">Cycling</option>
          </select>
        </div>
        <div class="select-container">
          <span>method </span>
          <select id="isochrone-method-select">
            <option value="time">Time</option>
            <option value="distance">Distance</option>
          </select>
        </div>
        <div class="select-container">
          <span>value </span>
          <input
            id="isochrone-distance-input"
            type="number"
            value="50"
            min="1"
            max="120"
          />
        </div>
        <div class="select-container">
          <small style="opacity: 0.5; padding: 0 5px"
            >click on the map to change isochrone origin</small
          >
        </div>
      </div>
      <wmp-map id="map"></wmp-map>
    </div>

    <script>
      ((g) => {
        let p;
        const w = window,
          d = document;
        const L = "importLibrary",
          CB = "__ib__";
        const E = "The Woosmap Maps JavaScript API";
        const woosmap = w.woosmap || (w.woosmap = {});
        const maps = woosmap.map || (woosmap.map = {});
        // Seed with the sample's configured libraries: some (e.g. widgets) are
        // not importLibrary() names and only load through the script URL.
        const libs = new Set(
            String(g.libraries || "")
              .split(",")
              .filter(Boolean),
          ),
          params = new URLSearchParams();
        const load = () =>
          p ||
          (p = new Promise((res, rej) => {
            const s = d.createElement("script");
            params.set("libraries", [...libs].join(","));
            for (const k in g)
              if (k !== "libraries" && g[k]) params.set(k, g[k]);
            params.set("callback", "woosmap.map." + CB);
            s.src = "https://sdk.woosmap.com/map/map.js?" + params;
            maps[CB] = res;
            s.onerror = () => rej(Error(E + " could not load."));
            s.nonce = d.querySelector("script[nonce]")?.nonce || "";
            d.head.append(s);
          }));
        if (maps[L]) {
          console.warn(E + " only loads once. Ignoring:", g);
        } else {
          maps[L] = (name, ...args) =>
            libs.add(name) && load().then(() => maps[L](name, ...args));
        }
      })({
        key: "woos-e1e5490b-19d1-34f8-9955-fd5cfc8c880f",
        libraries: "marker",
        language: "",
      });
    </script>
  </body>
</html>
